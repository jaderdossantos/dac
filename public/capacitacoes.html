<!DOCTYPE html>
<html>
<head>
  <title>Capacitações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand">Sistema</a>
  </div>
</nav>

<div class="container mt-5">

  <h2>Capacitações</h2>

  <a href="/home.html" class="btn btn-secondary mb-3">
    Voltar
  </a>

  <a href="/cadastro_capacitacao.html"
     class="btn btn-primary mb-3">
    Nova Capacitação
  </a>

  <table class="table table-bordered table-striped">

    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Funcionário</th>
        <th>Tipo</th>
        <th>Data</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody id="tabela"></tbody>

  </table>

</div>

<script>

async function carregar() {

  const res = await fetch('/capacitacoes');
  const data = await res.json();

  const tabela = document.getElementById('tabela');

  tabela.innerHTML = '';

  data.forEach(c => {

    tabela.innerHTML += `
      <tr>
        <td>${c.capacitacao_id}</td>
        <td>${c.funcionario}</td>
        <td>${c.tipo}</td>
        <td>${new Date(c.datahora).toLocaleString()}</td>

        <td>
          <button
            class="btn btn-danger btn-sm"
            onclick="deletar(${c.capacitacao_id})">
            Excluir
          </button>
        </td>
      </tr>
    `;

  });

}

async function deletar(id) {

  if (!confirm('Deseja excluir?')) return;

  await fetch('/capacitacoes/' + id, {
    method: 'DELETE'
  });

  carregar();

}

carregar();

</script>

</body>
</html>

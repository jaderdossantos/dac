<!DOCTYPE html>
<html>
<head>
  <title>Funcionários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand">Sistema</a>
  </div>
</nav>

<div class="container mt-5">

  <h2>Funcionários</h2>

  <a href="/home.html" class="btn btn-secondary mb-3">Voltar</a>

  <a href="/cadastro_pessoa.html" class="btn btn-primary mb-3">
    Novo Funcionário
  </a>

  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>Nascimento</th>
        <th>Telefone</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody id="tabela"></tbody>
  </table>

</div>

<script>
async function carregar() {
  const res = await fetch('/pessoas');
  const data = await res.json();

  const tabela = document.getElementById('tabela');
  tabela.innerHTML = '';

  data.forEach(p => {
    tabela.innerHTML += `
      <tr>
        <td>${p.pessoa_id}</td>
        <td>${p.nome}</td>
        <td>${p.cpf}</td>
        <td>${p.nascimento}</td>
        <td>${p.telefone}</td>
        <td>
          <button class="btn btn-warning btn-sm"
            onclick="editar(
              ${p.pessoa_id},
              '${p.nome}',
              '${p.cpf}',
              '${p.nascimento}',
              '${p.telefone}'
            )">
            Editar
          </button>

          <button class="btn btn-danger btn-sm"
            onclick="deletar(${p.pessoa_id})">
            Excluir
          </button>
        </td>
      </tr>
    `;
  });
}

async function deletar(id) {
  if (!confirm('Deseja excluir?')) return;

  await fetch('/pessoas/' + id, {
    method: 'DELETE'
  });

  carregar();
}

async function editar(id, nomeAtual, cpfAtual, nascimentoAtual, telefoneAtual) {

  const nome = prompt('Nome:', nomeAtual);
  const cpf = prompt('CPF:', cpfAtual);
  const nascimento = prompt('Nascimento:', nascimentoAtual);
  const telefone = prompt('Telefone:', telefoneAtual);

  if (!nome || !cpf || !nascimento || !telefone) {
    alert('Preencha todos os campos');
    return;
  }

  await fetch('/pessoas/' + id, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      nome,
      cpf,
      nascimento,
      telefone
    })
  });

  carregar();
}

carregar();
</script>

</body>
</html>

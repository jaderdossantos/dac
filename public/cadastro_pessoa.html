<!DOCTYPE html>
<html>
<head>
  <title>Cadastro Funcionário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <h2>Cadastrar Funcionário</h2>

  <a href="/pessoas.html" class="btn btn-secondary mb-3">
    Voltar
  </a>

  <input id="nome" class="form-control mb-2" placeholder="Nome">

  <input id="cpf" class="form-control mb-2" placeholder="CPF">

  <input id="nascimento" type="date"
    class="form-control mb-2">

  <input id="telefone" class="form-control mb-3"
    placeholder="Telefone">

  <button class="btn btn-success"
    onclick="cadastrar()">
    Cadastrar
  </button>

<script>
async function cadastrar() {

  const nome = document.getElementById('nome').value;
  const cpf = document.getElementById('cpf').value;
  const nascimento = document.getElementById('nascimento').value;
  const telefone = document.getElementById('telefone').value;

  if (!nome || !cpf || !nascimento || !telefone) {
    alert('Preencha todos os campos!');
    return;
  }

  const res = await fetch('/pessoas', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      nome,
      cpf,
      nascimento,
      telefone
    })
  });

  if (res.ok) {
    alert('Funcionário cadastrado!');
    window.location.href = '/pessoas.html';
  } else {
    const erro = await res.text();
    alert('Erro: ' + erro);
  }
}
</script>

</body>
</html>
